[vars]
pkg_name = "wsl-bootstrapper"
ansible_archive_name = "ansible"
pkg_version = "0.1.0"

[tools]
powershell = "latest"
python = "3.12"
shellcheck = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "source"

[tasks]
lint-ansible = "ansible-lint ansible/"
test = "pytest -s tests"

[tasks.init]
run = [
  "mise install",
  "mise exec -- uv sync"
]

[tasks.lint]
description = "Run all linting tasks"
depends = ["lint-ansible"]

[tasks.publish]
run = [
  "rm -rf dist",
  "mkdir -p dist",
  "git ls-files -z --cached --others --exclude-standard --full-name -- ansible | tar -czf dist/{{ vars.ansible_archive_name }}.tar.gz --null -T - --transform 's,^ansible/,,'",
  """
  v="{{ vars.pkg_version }}"
  [ -n "$RELEASE" ] || v="$v-dev+$(git rev-parse --short HEAD)$(git diff --quiet HEAD -- ansible || echo .dirty)"
  (cd dist && zip "{{ vars.pkg_name }}.v$v.zip" {{ vars.ansible_archive_name }}.tar.gz)
  """
]
outputs = [ "dist" ]
