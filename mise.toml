[vars]
pkg_name = "wsl-bootstrapper"
ansible_archive_name = "ansible"
pkg_version = "0.1.0"

[tools]
python = "3.12"
shellcheck = "latest"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["python"]
python.uv_venv_auto = "source"

[tasks]
lint-ansible = "ansible-lint ansible/"
test = "pytest -s tests"

[tasks.init]
run = [
  "mise install",
  "mise exec -- uv sync"
]

[tasks.lint]
description = "Run all linting tasks"
depends = ["lint-ansible"]

[tasks.publish]
run = [
  "rm -rf dist",
  "mkdir -p dist",
  "git archive -o dist/{{ vars.ansible_archive_name }}.tar.gz HEAD:ansible/",
  "(cd dist && zip {{ vars.pkg_name }}.v{{ vars.pkg_version }}.zip ./*)"
]
sources = [ "ansible/" ]
outputs = [ "dist" ]
