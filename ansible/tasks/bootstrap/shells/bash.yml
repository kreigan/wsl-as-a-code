---
- name: Check if Oh My Bash is installed
  ansible.builtin.stat:
    path: &omb_path "{{ ansible_facts['env']['HOME'] }}/.oh-my-bash"
  register: omb_path
  changed_when: false

- name: Install Oh My Bash
  when: user_shell == "bash" and need_shell_framework and not omb_path.stat.exists
  block:
    - name: Download installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmybash/oh-my-bash/master/tools/install.sh
        dest: &tmpfile /tmp/ohmybash_install.sh
        mode: '0755'
    - name: Install Oh My Bash
      ansible.builtin.command:
        argv:
          - bash
          - *tmpfile
          - --unattended
        creates: *omb_path
  always:
    - name: Remove installation script
      ansible.builtin.file:
        path: *tmpfile
        state: absent
