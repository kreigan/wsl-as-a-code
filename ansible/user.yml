- name: Configure WSL user
  hosts: &host localhost
  become: true
  tags: [user, configure]
  vars_files:
    - vars/main.yml
  vars_prompt:
    - name: user_name
      prompt: "\nYour new WSL user name"
      private: false

    - name: user_password
      prompt: "password"
      unsafe: true
      private: true
      confirm: true

    - name: user_shell
      prompt: "Choose your preferred shell ({{ allowed_shells | join('|') }})"
      default: "zsh"
      private: false
  tasks:
    - name: Validate user name is not empty
      tags: bootstrap
      ansible.builtin.assert:
        that: user_name | length > 0
        fail_msg: "User name cannot be empty."

    - name: Validate user password hash is not empty
      ansible.builtin.assert:
        that: user_password | length > 0
        fail_msg: "User password cannot be empty."

    - name: Validate user shell choice
      tags: bootstrap
      ansible.builtin.assert:
        that: user_shell in allowed_shells
        fail_msg: "Unknown shell '{{ user_shell }}'. Allowed values: {{ allowed_shells | join(', ') }}"

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: pacman

    - name: Configure WSL user
      block:
        - name: Get shell executable path # noqa: command-instead-of-shell
          ansible.builtin.shell: "command -v {{ user_shell }}"
          register: shell_path
          changed_when: false
          failed_when: shell_path.rc != 0

        - name: Create a new WSL user
          ansible.builtin.user:
            name: "{{ user_name }}"
            uid: "{{ user_uid }}"
            groups: wheel
            append: true
            create_home: true
            password: "{{ user_password | password_hash(salt='a87b4e16') }}"
            shell: "{{ shell_path.stdout }}"

        - name: Add user to docker group if Docker is installed
          ansible.builtin.user:
            name: "{{ user_name }}"
            groups: docker
            append: true
          when: "'docker' in ansible_facts['packages']"

        - name: Configure sudoers for the WSL user
          ansible.builtin.copy:
            dest: "/etc/sudoers.d/{{ user_name }}"
            content: "{{ user_name }} ALL=(ALL) NOPASSWD: ALL"
            owner: root
            group: root
            mode: '0440'

        - name: Set as default WSL user
          community.general.ini_file:
            path: /etc/wsl.conf
            section: user
            option: default
            value: "{{ user_name }}"
            mode: '0644'
            owner: root
            group: root

        - name: Enable lingering
          ansible.builtin.command:
            cmd: "loginctl enable-linger {{ user_name }}"
            creates: "/var/lib/systemd/linger/{{ user_name }}"

    - name: Save user facts
      tags: bootstrap
      ansible.builtin.set_fact:
        user_name: "{{ user_name }}"
        user_shell: "{{ user_shell }}"

- name: Bootstrap user profile
  hosts: *host
  become: true
  tags: [user, bootstrap]
  tasks:
    - name: Run shell configuration tasks
      ansible.builtin.include_tasks: "{{ shell }}"
      loop: "{{ q('ansible.builtin.fileglob', 'tasks/shells/*') }}"
      loop_control:
        loop_var: shell
