config_dir: .config

bashrcd_sys_dir: /etc/bash.bashrc.d
bashrcd_user_dir: "{{ config_dir }}/bashrc.d"

zshrcd_sys_dir: /etc/zsh/zshrc.d
zshrcd_user_dir: "{{ config_dir }}/zshrc.d"

wsl_rootfs_path: /mnt
wsl_config: |
  [boot]
  systemd=true

  [automount]
  options = "metadata"

  [interop]
  appendWindowsPath = false

operational_packages:
  - csvtool
  - dos2unix
  - rename
