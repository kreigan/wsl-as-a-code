locale: "en_US.UTF-8"

packages:
  essential_packages:
    - base-devel
    - bash-completion
    - chezmoi
    - curl
    - docker
    - docker-buildx
    - docker-compose
    - fd
    - git
    - inetutils
    - iproute2
    - less
    - man-db
    - man-pages
    - mise
    - moor
    - moreutils
    - ripgrep
    - rsync
    - socat
    - starship
    - unzip
    - uv
    - vim
    - wget
    - zip
    - zsh-autosuggestions
    - zsh-completions
    - zsh-syntax-highlighting

  shells:
    - bash
    - nushell
    - zsh

  operational_packages:
    - dos2unix
    - jq
    - pgcli
    - pgformatter
    - postgresql-docs
    - postgresql-libs
    - tree
    - yq

services:
  - docker

wsl_mount_options:
  - metadata
  - uid={{ user_uid | default(1000) }}

wsl_conf: |
  [boot]
  systemd=true

  [automount]
  options = "{{ wsl_mount_options | join(',') }}"

# For this to work, run this in PowerShell and start a new WSL session:
#   set WSLENV "USERPROFILE/p:APPDATA/p:OneDrive/p"
win_user_profile: "{{ ansible_facts['env']['USERPROFILE'] }}"
win_appdata: "{{ ansible_facts['env']['APPDATA'] }}"
win_onedrive_folder: "{{ ansible_facts['env']['OneDrive'] }}"

wsl_links:
  - { src: "{{ win_user_profile }}", dst: "/wusr" }
  - { src: "{{ win_appdata }}", dst: "/appdata" }
  - { src: "{{ win_onedrive_folder }}", dst: "/1drv" }
  - { src: "/wusr/Downloads", dst: "/downloads" }
  - { src: "/1drv/Documents", dst: "/documents" }

allowed_shells: "{{ packages.shells | map('replace', 'nushell', 'nu') | list }}"
