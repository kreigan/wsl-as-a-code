packages:
  essential_packages:
    - base-devel
    - bash-completion
    - chezmoi
    - curl
    - docker
    - docker-buildx
    - docker-compose
    - fd
    - git
    - inetutils
    - iproute2
    - less
    - man-db
    - man-pages
    - mise
    - moor
    - moreutils
    - ripgrep
    - rsync
    - socat
    - starship
    - unzip
    - uv
    - vim
    - wget
    - zip
    - zsh-autosuggestions
    - zsh-completions
    - zsh-syntax-highlighting

  shells:
    - bash
    - nushell
    - zsh

  operational_packages:
    - dos2unix
    - jq
    - pgcli
    - pgformatter
    - postgresql-docs
    - postgresql-libs
    - tree
    - yq

services:
  - docker

wsl_conf: |
  [boot]
  systemd=true

  [automount]
  options = "metadata"

win_user_profile: "{{ lookup('ansible.builtin.env', 'USERPROFILE') }}"

npiperelay_bin: "{{ win_user_profile }}/bin/npiperelay.exe"

allowed_shells: "{{ packages.shells | map('replace', 'nushell', 'nu') | list }}"
