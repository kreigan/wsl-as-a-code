---
- name: Core system setup
  hosts: &host localhost
  become: true
  vars:
    ansible_python_interpreter: &interpreter /usr/bin/python3
  vars_files:
    - vars/system.yml
  vars_prompt:
    - name: user_name
      prompt: "Your new WSL user name"
      private: false

    - name: user_password
      prompt: "password"
      unsafe: true
      private: true
      confirm: true

    - name: user_shell
      prompt: "Choose your preferred shell (zsh|nu|bash)"
      default: "zsh"
      private: false

  tasks:
    - name: Validate user name is not empty
      ansible.builtin.assert:
        that: user_name | length > 0
        fail_msg: "User name cannot be empty."

    - name: Validate user password hash is not empty
      ansible.builtin.assert:
        that: user_password | length > 0
        fail_msg: "User password cannot be empty."

    - name: Validate user shell choice
      ansible.builtin.assert:
        that: user_shell in allowed_shells
        fail_msg: "Unknown shell '{{ user_shell }}'. Allowed values: {{ allowed_shells | join(', ') }}"
      vars:
        allowed_shells: "{{ packages.shells | map('replace', 'nushell', 'nu') | list }}"

    - name: Make sure it is Arch Linux
      ansible.builtin.assert:
        that: ansible_facts["distribution"] == "Archlinux"
        fail_msg: "This playbook is only intended for Arch Linux."

    - name: Perform system setup tasks
      ansible.builtin.include_tasks: tasks/setup_system.yml

    - name: Setup WSL user
      ansible.builtin.include_tasks: tasks/setup_user.yml
      vars:
        user_password_hash: "{{ user_password | password_hash(salt='a87b4e16') }}"

    - name: Save user facts
      ansible.builtin.set_fact:
        user_name: "{{ user_name }}"
        user_shell: "{{ user_shell }}"

- name: Configure WSL user
  hosts: *host
  become: true
  become_user: "{{ user_name }}"
  tags: bootstrap
  vars:
    ansible_python_interpreter: *interpreter

  vars_prompt:
    - name: need_shell_framework
      prompt: "(bash/zsh only) Install shell framework? (Y/n)"
      default: "y"
      private: false

    - name: chezmoi_repo
      prompt: "chezmoi repository path (local or remote) or empty to skip"
      private: false

  tasks:
    - name: Run user configuration tasks
      ansible.builtin.include_tasks: tasks/bootstrap_user.yml
      vars:
        need_shell_framework: "{{ need_shell_framework | bool }}"
