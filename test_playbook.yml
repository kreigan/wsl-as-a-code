---
- name: Test bootstrap script
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/sbin/python3
  tasks:
    - name: Create test file
      ansible.builtin.copy:
        content: "{{ test_file_content | mandatory }}"
        dest: "{{ test_file_path | mandatory }}"
        mode: '0644'
